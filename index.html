<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parallel Reader V2</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#26323c;background:#f5f4f0}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid #ddd;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:17px;margin:0;margin-right:auto}button,input,textarea,select{font:inherit}button{border:1px solid #c9d0d6;border-radius:9px;padding:8px 12px;background:white;cursor:pointer}button.primary{background:#244d70;color:white}label{font-size:13px;display:inline-flex;align-items:center;gap:5px}.layout{display:grid;grid-template-columns:1fr 1fr;height:calc(100dvh - 113px);gap:1px;background:#d9dce0}.pane{background:#fff;overflow:auto;position:relative}.pane h2{font-size:13px;color:#697684;letter-spacing:.08em;position:sticky;top:0;background:#fff;padding:12px 22px;margin:0;border-bottom:1px solid #eee}.reader{padding:22px clamp(18px,4vw,64px);font-family:Georgia,'Noto Serif SC',serif;font-size:18px;line-height:2.05;white-space:pre-wrap;overflow-wrap:anywhere}.reader p{margin:0 0 1.1em}.first{background:#fff09a;border-radius:3px;padding:0 2px}.term{background:#d9eafb;border-bottom:2px solid #699bc7;border-radius:2px}.question{background:#f7d4dc;border-bottom:1px solid #b86578}.drawer{position:fixed;right:12px;bottom:12px;width:min(440px,calc(100vw - 24px));max-height:65dvh;overflow:auto;background:#fff;border:1px solid #d3d8de;border-radius:16px;box-shadow:0 12px 35px #0003;padding:16px;z-index:10;display:none}.drawer.open{display:block}.drawer textarea{width:100%;min-height:72px;margin-top:10px}.muted{color:#66727d;font-size:13px}.selection{background:#f2f5f8;padding:10px;border-radius:8px;max-height:100px;overflow:auto}.bar{background:#fff;padding:9px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #ddd}.edit{width:100%;min-height:180px;resize:vertical;padding:10px}.editor{display:none;position:fixed;inset:8% 5%;z-index:12;background:white;overflow:auto;padding:24px;box-shadow:0 10px 40px #0004;border-radius:15px}.editor.open{display:block}.editorgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}iframe{width:100%;height:100%;border:0}#pdfview{display:none;height:100%}.hide{display:none!important}@media(max-width:700px){.layout{grid-template-columns:1fr;height:calc(100dvh - 150px)}.pane:first-child{display:none}.layout.showenglish .pane:first-child{display:block}.layout.showenglish .pane:last-child{display:none}.editorgrid{grid-template-columns:1fr}.reader{font-size:17px}}</style></head><body><header><h1>📖 Parallel Reader <small style="color:#85909a">V2</small></h1><button onclick="openEditor()">导入 / 编辑文本</button><label>PDF <input id="file" type="file" accept="application/pdf" style="max-width:165px" onchange="loadPdf(event)"></label><button onclick="togglePdf()">原文 PDF / 文本</button><button onclick="exportNotes()">导出批注</button></header><div class="bar"><label><input type="checkbox" id="first" checked onchange="render()">句首荧光</label><label><input type="checkbox" id="terms" checked onchange="render()">重点词上色</label><label>字体 <input type="range" id="size" min="15" max="25" value="18" oninput="setSize()"></label><button onclick="toggleMobile()">切换中/英文（手机）</button><span class="muted" id="status">选中中文或英文，即可针对原文记下问题</span></div><main class="layout" id="layout"><section class="pane" id="enpane"><h2>ENGLISH · ORIGINAL</h2><div id="en" class="reader"></div><div id="pdfview"><iframe id="pdf" title="PDF 原文"></iframe></div></section><section class="pane" id="zhpane"><h2>中文 · TRANSLATION</h2><div id="zh" class="reader"></div></section></main><aside class="drawer" id="drawer"><div style="display:flex;justify-content:space-between"><b>📌 段落提问 / 批注</b><button onclick="closeDrawer()">关闭 ×</button></div><p class="muted">选中的内容</p><div id="quote" class="selection"></div><textarea id="question" placeholder="这里记录你的问题。要获得 AI 回答，可复制下方提示词发给 ChatGPT。"></textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="primary" onclick="saveNote()">保存批注</button><button onclick="copyQuestion()">复制给 ChatGPT</button></div><p class="muted">此离线版不具备内置 AI 回答；提问和阅读位置可在本机保留。</p><div id="notes"></div></aside><section id="editor" class="editor"><div style="display:flex;justify-content:space-between;gap:10px"><h2>导入双语文本</h2><button onclick="closeEditor()">完成 ×</button></div><p class="muted">将英文原文与中文译文分别粘贴到下方。空行分段。浏览器本地保存文本，不会上传到服务器。</p><div class="editorgrid"><div><h3>英文原文</h3><textarea id="editEn" class="edit"></textarea></div><div><h3>中文译文</h3><textarea id="editZh" class="edit"></textarea></div></div><p><label>高亮术语（英文/中文，用逗号分隔） <input id="editTerms" style="width:min(540px,80vw)" placeholder="equality, 平等, responsibility, 责任"></label></p><button class="primary" onclick="applyEditor()">保存并进入阅读</button></section><script>const demoEn='Equality is not merely a matter of distributing goods. It also concerns the relations among persons.\n\nA just society must consider both individual responsibility and genuine opportunities for participation. These principles can sometimes come into tension.';const demoZh='平等不仅是分配物品的问题。它还涉及人与人之间的关系。\n\n一个正义的社会既需要考虑个人责任，也需要考虑人们参与社会生活的实质性机会。这些原则有时会相互冲突。';let state=JSON.parse(localStorage.getItem('prv2')||'null')||{en:demoEn,zh:demoZh,terms:'equality,平等,responsibility,责任,opportunities,机会',notes:[],first:true,termsOn:true,size:18};let selected='',pdfUrl=null,pdfMode=false;function persist(){localStorage.setItem('prv2',JSON.stringify(state))}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function mark(s){let safe=esc(s);if(document.getElementById('terms').checked){let words=state.terms.split(/[,，]/).map(x=>x.trim()).filter(Boolean).sort((a,b)=>b.length-a.length);if(words.length){let regex=new RegExp('('+words.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');safe=safe.replace(regex,'<mark class="term">$1</mark>')}}if(document.getElementById('first').checked){safe=safe.replace(/(^|[。！？.!?]\s*)([\p{L}\p{N}]+)/gu,'$1<mark class="first">$2</mark>')}return safe}function render(){let p1=document.getElementById('enpane').scrollTop,p2=document.getElementById('zhpane').scrollTop;document.getElementById('en').innerHTML=state.en.split(/\n\s*\n/).map(p=>'<p>'+mark(p)+'</p>').join('');document.getElementById('zh').innerHTML=state.zh.split(/\n\s*\n/).map(p=>'<p>'+mark(p)+'</p>').join('');state.first=document.getElementById('first').checked;state.termsOn=document.getElementById('terms').checked;persist();document.getElementById('enpane').scrollTop=p1;document.getElementById('zhpane').scrollTop=p2}function setSize(){state.size=+document.getElementById('size').value;document.querySelectorAll('.reader').forEach(e=>e.style.fontSize=state.size+'px');persist()}function openEditor(){document.getElementById('editEn').value=state.en;document.getElementById('editZh').value=state.zh;document.getElementById('editTerms').value=state.terms;document.getElementById('editor').classList.add('open')}function closeEditor(){document.getElementById('editor').classList.remove('open')}function applyEditor(){state.en=document.getElementById('editEn').value;state.zh=document.getElementById('editZh').value;state.terms=document.getElementById('editTerms').value;render();closeEditor()}function loadPdf(e){let f=e.target.files[0];if(!f)return;if(pdfUrl)URL.revokeObjectURL(pdfUrl);pdfUrl=URL.createObjectURL(f);document.getElementById('pdf').src=pdfUrl;pdfMode=true;togglePdf(true);document.getElementById('status').textContent='PDF 已在原文栏打开；译文仍需手动导入'}function togglePdf(force){pdfMode=force===true?true:!pdfMode;if(!pdfUrl){pdfMode=false;alert('请先选择 PDF 文件');return}document.getElementById('pdfview').style.display=pdfMode?'block':'none';document.getElementById('en').style.display=pdfMode?'none':'block'}function toggleMobile(){document.getElementById('layout').classList.toggle('showenglish')}document.addEventListener('mouseup',capture);document.addEventListener('touchend',()=>setTimeout(capture,100));function capture(){let sel=window.getSelection();if(!sel||sel.isCollapsed)return;let node=sel.anchorNode;let parent=node&&node.parentElement;if(!parent||!parent.closest('#en,#zh'))return;selected=sel.toString().trim();if(selected){document.getElementById('quote').textContent=selected;document.getElementById('question').value='';document.getElementById('drawer').classList.add('open');renderNotes()}}function closeDrawer(){document.getElementById('drawer').classList.remove('open')}function saveNote(){let q=document.getElementById('question').value.trim();if(!q)return alert('请先输入问题或笔记');state.notes.unshift({quote:selected,question:q,date:new Date().toLocaleString()});persist();renderNotes()}function renderNotes(){document.getElementById('notes').innerHTML=state.notes.map(n=>'<div style="border-top:1px solid #ddd;margin-top:12px;padding-top:8px"><div class="muted">'+esc(n.date)+'</div><div>'+esc(n.quote)+'</div><b>'+esc(n.question)+'</b></div>').join('')}function copyQuestion(){let q=document.getElementById('question').value;let t='请作为哲学学术阅读助手，结合以下文献片段回答我的疑问，区分作者原意与解释，并尽量简洁。\n原文片段：'+selected+'\n我的问题：'+q;navigator.clipboard.writeText(t).then(()=>alert('已复制，可粘贴到 ChatGPT')).catch(()=>prompt('请复制以下内容',t))}function exportNotes(){let text=state.notes.map(n=>n.date+'\n引文：'+n.quote+'\n问题：'+n.question).join('\n\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download='ParallelReader_批注.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.getElementById('first').checked=state.first;document.getElementById('terms').checked=state.termsOn;document.getElementById('size').value=state.size;setSize();render();</script></body></html>
